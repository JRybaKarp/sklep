<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamówienie – Nailchemy</title>
    <meta name="description" content="Dokończ zamówienie w sklepie internetowym Nailchemy.">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Style całej strony (jeden wspólny plik) -->
    <link rel="stylesheet" href="css/style.css">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Zamówienie – Nailchemy">
    <meta property="og:description" content="Dokończ zamówienie w sklepie internetowym Nailchemy.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1632345031435-8727f6897d53?auto=format&amp;fit=crop&amp;w=1200&amp;q=80">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebPage", "name": "Zamówienie – Nailchemy", "description": "Dokończ zamówienie w sklepie internetowym Nailchemy.", "publisher": {"@type": "Organization", "name": "Nailchemy Sp. z o.o."}}</script>
</head>
<body data-page="checkout">

    <!-- NAVBAR + panele Kategorie / Koszyk (wstawiane przez js/navbar.js) -->
    <script src="js/navbar.js"></script>

    <!-- ===== TREŚĆ STRONY ===== -->
        <main class="container py-5">
            <h1 class="h3 text-accent mb-4"><i class="fa-solid fa-cash-register me-2"></i> Finalizacja Zamówienia (Kasa)</h1>
            <form id="checkoutForm">
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="sticky-summary-box p-4 mb-4">
                            <h4 class="h5 text-accent mb-3">1. Dane Bilingowe i Adres Dostawy</h4>
                            <div class="row g-3">
                                <div class="col-md-6"><label class="form-label text-white-50 small">Imię</label><input type="text" class="form-control" required value="Anna"></div>
                                <div class="col-md-6"><label class="form-label text-white-50 small">Nazwisko</label><input type="text" class="form-control" required value="Kowalska"></div>
                                <div class="col-12"><label class="form-label text-white-50 small">Ulica i numer</label><input type="text" class="form-control" required value="ul. Alchemiczna 12/4"></div>
                                <div class="col-md-4"><label class="form-label text-white-50 small">Kod pocztowy</label><input type="text" class="form-control" required value="00-001"></div>
                                <div class="col-md-8"><label class="form-label text-white-50 small">Miasto</label><input type="text" class="form-control" required value="Warszawa"></div>
                                <div class="col-md-6"><label class="form-label text-white-50 small">Telefon</label><input type="tel" class="form-control" required value="+48 123 456 789"></div>
                                <div class="col-md-6"><label class="form-label text-white-50 small">E-mail</label><input type="email" class="form-control" required value="anna@example.pl"></div>
                            </div>
                        </div>
    
                        <div class="sticky-summary-box p-4 mb-4">
                            <h4 class="h5 text-accent mb-3">2. Wybierz Metodę Dostawy</h4>
                            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="d" id="d1" checked><label class="form-check-label text-white-50" for="d1">Kurier DPD (15,00 PLN)</label></div>
                            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="d" id="d2"><label class="form-check-label text-white-50" for="d2">Paczkomat InPost (12,00 PLN)</label></div>
                            <div class="form-check"><input class="form-check-input" type="radio" name="d" id="d3"><label class="form-check-label text-white-50" for="d3">Odbiór osobisty w Warszawie (0,00 PLN)</label></div>
                        </div>
    
                        <div class="sticky-summary-box p-4">
                            <h4 class="h5 text-accent mb-3">3. Wybierz Metodę Płatności</h4>
                            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="p" id="p1" checked><label class="form-check-label text-white-50" for="p1">BLIK</label></div>
                            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="p" id="p2"><label class="form-check-label text-white-50" for="p2">Karta płatnicza</label></div>
                            <div class="form-check"><input class="form-check-input" type="radio" name="p" id="p3"><label class="form-check-label text-white-50" for="p3">Szybki przelew</label></div>
                            <div class="form-check mt-3 pt-3 border-top border-secondary">
                                <input class="form-check-input" type="checkbox" id="wantInvoiceCheckbox" name="wantInvoice">
                                <label class="form-check-label text-white-50" for="wantInvoiceCheckbox">Chcę otrzymać fakturę na firmę</label>
                            </div>
                            <div id="invoiceFieldsContainer" class="mt-3 p-3 rounded-3" style="background: rgba(30,22,25,0.65); border: 1px solid rgba(191,142,160,0.28);" hidden>
                                <h5 class="h6 text-accent mb-3"><i class="fa-solid fa-file-invoice me-2"></i> Dane do faktury VAT</h5>
                                <div class="row g-3">
                                    <div class="col-md-7">
                                        <label class="form-label text-white-50 small" for="invoiceCompanyName">Nazwa firmy *</label>
                                        <input type="text" class="form-control" id="invoiceCompanyName" name="invoiceCompanyName" placeholder="np. Studio Paznokci Beauty Sp. z o.o.">
                                    </div>
                                    <div class="col-md-5">
                                        <label class="form-label text-white-50 small" for="invoiceNip">NIP *</label>
                                        <input type="text" class="form-control" id="invoiceNip" name="invoiceNip" placeholder="np. 1234567890">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label text-white-50 small" for="invoiceAddress">Adres siedziby firmy *</label>
                                        <input type="text" class="form-control" id="invoiceAddress" name="invoiceAddress" placeholder="np. ul. Kosmetyczna 8, 00-120 Warszawa">
                                    </div>
                                </div>
                            </div>
                            <div class="form-check mt-3"><input class="form-check-input" type="checkbox" required><label class="form-check-label text-white-50 small">Akceptuję regulamin sklepu internetowego oraz politykę prywatności *</label></div>
                        </div>
                    </div>
    
                    <div class="col-lg-4">
                        <div class="sticky-summary-box">
                            <h4 class="h5 text-accent mb-3">Podsumowanie Zamówienia</h4>
                            <ul class="list-unstyled text-white-50 small mb-3" id="checkoutItems"></ul>
                            <div class="d-flex justify-content-between mb-2 text-white-50"><span>Dostawa:</span><strong class="text-white" id="checkoutShipping">15,00 PLN</strong></div>
                            <div class="d-flex justify-content-between mb-4 pt-3 border-top border-secondary">
                                <span class="h6 text-accent mb-0">Do zapłaty:</span>
                                <span class="h5 text-accent fw-bold mb-0" id="checkoutTotal">155,00 PLN</span>
                            </div>
                            <button type="submit" class="btn btn-alchemy-primary cart-action-button w-100 rounded-pill py-3" id="checkoutPayButton">
                                Kupuję i płacę <i class="fa-solid fa-lock ms-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </main>

    <!-- STOPKA (wstawiana przez js/footer.js) -->
    <script src="js/footer.js"></script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Wspólne skrypty (modal powiadomień, helpery) -->
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
